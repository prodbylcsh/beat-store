# Nasazení: push do `develop` -> TEST worker, push do `main` -> PRODUKCE.
# Potřebuje GitHub Secrets CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID (viz docs/NAVOD.md).
# Bez nich se workflow přeskočí. Lemon Squeezy klíče sem NEPATŘÍ – jsou v Cloudflare Secrets.
name: Deploy
on:
  push:
    branches: [main, develop]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: ${{ github.ref_name == 'main' && 'wrangler.jsonc' || 'wrangler.test.jsonc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Migrace databáze
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote --config "$CONFIG"
      - name: Nasazení workeru
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config "$CONFIG"
